<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | NeonLabs</title>
    <meta name="description" content="View saved NeonLabs ideas and Roomly room design plans from your local project dashboard." />
    <link rel="canonical" href="https://zeiterjosh-cloud.github.io/NEONLABS/dashboard.html" />
    <link rel="stylesheet" href="./styles.css" />
    <style>
      .dashboard-page{padding:42px 0 80px}.dashboard-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.dash-panel{border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.94);box-shadow:0 14px 46px rgba(20,32,27,.08);padding:22px}.panel-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:16px}.item-list{display:grid;gap:12px}.saved-item{border:1px solid var(--line);border-radius:8px;background:#f7faf7;padding:14px}.saved-item strong{display:block;margin-bottom:5px}.saved-item small{color:var(--muted);font-weight:800}.saved-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.empty{color:var(--muted);line-height:1.55}.dash-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.dash-button{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 13px;border:0;border-radius:8px;background:var(--mint-dark);color:white;font:inherit;font-weight:900;cursor:pointer;text-decoration:none}.dash-button.dark{background:#101613}.toast{position:fixed;right:18px;bottom:18px;z-index:20;display:none;padding:13px 15px;border-radius:8px;background:#101613;color:white;font-weight:850}.toast.visible{display:block}@media(max-width:850px){.dashboard-grid{grid-template-columns:1fr}.panel-head{flex-direction:column}}
    </style>
  </head>
  <body>
    <header class="site-header"><a class="brand" href="./index.html"><span class="brand-mark">N</span><span>NeonLabs</span></a><nav><a href="./idea-generator.html">Idea Generator</a><a href="./roomly.html">Roomly</a><a href="./index.html#pricing">Pricing</a></nav><a class="nav-cta" href="./idea-generator.html">Start Free</a></header>
    <main class="dashboard-page">
      <section class="section-heading"><p class="eyebrow">Project dashboard</p><h1>Your saved NeonLabs projects.</h1><p>Access saved ideas, open generated landing sites, and review Roomly plans from this browser.</p></section>
      <section class="dashboard-grid">
        <article class="dash-panel"><div class="panel-head"><div><p class="eyebrow">Idea Vault</p><h2>Saved startup ideas</h2></div><a class="dash-button" href="./idea-generator.html">Generate More</a></div><div class="item-list" id="ideas"></div><div class="dash-actions"><button class="dash-button dark" id="copyIdeas">Copy Ideas</button><button class="dash-button dark" id="clearIdeas">Clear Ideas</button></div></article>
        <article class="dash-panel"><div class="panel-head"><div><p class="eyebrow">Roomly</p><h2>Saved room plans</h2></div><a class="dash-button" href="./roomly.html">Design Room</a></div><div class="item-list" id="rooms"></div><div class="dash-actions"><button class="dash-button dark" id="copyRooms">Copy Plans</button><button class="dash-button dark" id="clearRooms">Clear Plans</button></div></article>
      </section>
    </main><div class="toast" id="toast"></div>
    <script>
      const ideasEl=document.querySelector('#ideas'),roomsEl=document.querySelector('#rooms'),toast=document.querySelector('#toast');let ideas=JSON.parse(localStorage.getItem('neonlabsIdeaVault')||'[]');let rooms=JSON.parse(localStorage.getItem('roomlyPlans')||'[]');
      function showToast(text){toast.textContent=text;toast.classList.add('visible');setTimeout(()=>toast.classList.remove('visible'),1600)}function openLanding(idea){localStorage.setItem('neonlabsSelectedIdea',JSON.stringify(idea));window.location.href='./landing-site.html'}function item(title,meta,idea){const el=document.createElement('article');el.className='saved-item';el.innerHTML='<strong>'+title+'</strong><small>'+meta+'</small>';if(idea){const actions=document.createElement('div');actions.className='saved-actions';const open=document.createElement('button');open.className='dash-button';open.textContent='Open Landing Site';open.addEventListener('click',()=>openLanding(idea));actions.append(open);el.append(actions)}return el}
      function render(){ideasEl.innerHTML='';roomsEl.innerHTML='';if(!ideas.length)ideasEl.innerHTML='<p class="empty">No saved ideas yet. Open the Micro SaaS Generator and click “Steal This Idea.”</p>';ideas.forEach(x=>ideasEl.append(item(x.name,(x.category||'Idea')+' · '+(x.money||'monetization')+' · '+(x.buildTime||'build time'),x)));if(!rooms.length)roomsEl.innerHTML='<p class="empty">No saved room plans yet. Open Roomly, generate a layout, then click “Save Plan.”</p>';rooms.forEach(x=>roomsEl.append(item((x.style||'Roomly')+' '+(x.budget||'')+' plan',x.date||'saved plan')))}
      function ideaText(){return ideas.map(x=>`${x.name}\n${x.category||''} · ${x.money||''} · ${x.buildTime||''}`).join('\n\n---\n\n')}function roomText(){return rooms.map(x=>`${x.style||'Roomly'} ${x.budget||''} plan\n${x.date||''}`).join('\n\n---\n\n')}
      document.querySelector('#copyIdeas').addEventListener('click',async()=>{await navigator.clipboard.writeText(ideaText());showToast('Ideas copied')});document.querySelector('#copyRooms').addEventListener('click',async()=>{await navigator.clipboard.writeText(roomText());showToast('Room plans copied')});document.querySelector('#clearIdeas').addEventListener('click',()=>{ideas=[];localStorage.setItem('neonlabsIdeaVault','[]');render();showToast('Ideas cleared')});document.querySelector('#clearRooms').addEventListener('click',()=>{rooms=[];localStorage.setItem('roomlyPlans','[]');render();showToast('Room plans cleared')});render();
    </script>
  </body>
</html>
