<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generated Landing Site | NeonLabs</title>
    <meta name="description" content="A generated landing page preview for a saved NeonLabs Micro SaaS idea." />
    <link rel="stylesheet" href="./styles.css" />
    <style>
      body{background:#f7faf7}.landing-shell{width:min(1180px,calc(100% - 32px));margin:0 auto;padding:34px 0 80px}.landing-hero{display:grid;grid-template-columns:minmax(0,.95fr) minmax(360px,1.05fr);gap:34px;align-items:center;min-height:calc(100vh - 110px)}.landing-copy h1{font-size:clamp(2.5rem,5.8vw,5.2rem);line-height:.96;margin-bottom:18px}.landing-copy p{color:var(--muted);font-size:1.08rem;line-height:1.65}.landing-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}.landing-button{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:8px;background:var(--mint-dark);color:white;font-weight:900;text-decoration:none}.landing-button.dark{background:#101613}.product-preview{border:1px solid var(--line);border-radius:8px;background:white;box-shadow:var(--shadow);overflow:hidden}.preview-top{display:flex;gap:7px;padding:14px;border-bottom:1px solid var(--line)}.preview-top span{width:11px;height:11px;border-radius:50%;background:var(--line)}.preview-content{display:grid;gap:14px;padding:20px}.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{border:1px solid var(--line);border-radius:8px;background:#f7faf7;padding:12px}.metric strong{display:block}.metric small{color:var(--muted);font-weight:800}.section-band{padding:56px 0;border-top:1px solid var(--line)}.feature-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.feature{border:1px solid var(--line);border-radius:8px;background:white;padding:18px}.feature p{color:var(--muted);line-height:1.55}.empty-state{border:1px solid var(--line);border-radius:8px;background:white;padding:24px;margin-top:24px}@media(max-width:900px){.landing-hero,.feature-grid{grid-template-columns:1fr}.metric-grid{grid-template-columns:1fr}}
    </style>
  </head>
  <body>
    <header class="site-header"><a class="brand" href="./index.html"><span class="brand-mark">N</span><span>NeonLabs</span></a><nav><a href="./idea-generator.html">Idea Generator</a><a href="./dashboard.html">Dashboard</a><a href="./roomly.html">Roomly</a></nav><a class="nav-cta" href="./idea-generator.html">Generate More</a></header>
    <main class="landing-shell" id="app"></main>
    <script>
      const app=document.querySelector('#app');const idea=JSON.parse(localStorage.getItem('neonlabsSelectedIdea')||'null');
      function fallback(){app.innerHTML='<section class="empty-state"><p class="eyebrow">No landing site selected</p><h1>Pick an idea first.</h1><p>Go to the Micro SaaS Generator, click “Steal This Idea,” then click “Open Landing Site.”</p><div class="landing-actions"><a class="landing-button" href="./idea-generator.html">Open Idea Generator</a><a class="landing-button dark" href="./dashboard.html">Open Dashboard</a></div></section>'}
      function render(){if(!idea){fallback();return}const audience=idea.audience||'busy teams';const category=idea.category||'startup';const revenue=idea.revenue||'simple paid plans';app.innerHTML='<section class="landing-hero"><div class="landing-copy"><p class="eyebrow">Generated startup landing page</p><h1>'+idea.name+' helps '+audience+' move faster.</h1><p>A focused '+category.toLowerCase()+' Micro SaaS that removes repetitive work, creates clear next steps, and gives users a polished workspace they can rely on.</p><div class="landing-actions"><a class="landing-button" href="#pricing">Join Waitlist</a><a class="landing-button dark" href="#features">See Features</a></div></div><div class="product-preview"><div class="preview-top"><span></span><span></span><span></span></div><div class="preview-content"><p class="eyebrow">Product dashboard</p><h2>'+idea.name+'</h2><p>Generated outputs, saved projects, and export-ready workflows in one clean dashboard.</p><div class="metric-grid"><div class="metric"><strong>'+idea.difficulty+'</strong><small>Difficulty</small></div><div class="metric"><strong>'+idea.buildTime+'</strong><small>Build time</small></div><div class="metric"><strong>'+idea.money+'</strong><small>Model</small></div></div></div></div></section><section class="section-band" id="features"><div class="section-heading"><p class="eyebrow">MVP features</p><h2>Built around one painful workflow.</h2></div><div class="feature-grid"><article class="feature"><h3>Smart onboarding</h3><p>Collects the exact inputs needed to personalize the result for '+audience+'.</p></article><article class="feature"><h3>Generated workspace</h3><p>Turns user inputs into useful outputs, recommendations, and next actions.</p></article><article class="feature"><h3>Save and export</h3><p>Lets users save projects, share outputs, and return when they are ready to build.</p></article></div></section><section class="section-band" id="pricing"><div class="section-heading"><p class="eyebrow">Pricing angle</p><h2>'+revenue+'</h2><p>Start free to prove value, then unlock saved projects, unlimited outputs, and exports with a paid plan.</p></div></section>'}
      render();
    </script>
  </body>
</html>
