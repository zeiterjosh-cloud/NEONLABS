<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Micro SaaS Idea Generator | NeonLabs</title>
    <meta name="description" content="Generate fresh Micro SaaS startup ideas, MVP plans, revenue angles, and tech stack suggestions with NeonLabs." />
    <link rel="canonical" href="https://zeiterjosh-cloud.github.io/NEONLABS/idea-generator.html" />
    <link rel="stylesheet" href="./styles.css" />
    <style>
      .tool-page{padding:42px 0 80px}.app-panel{display:grid;grid-template-columns:360px minmax(0,1fr);gap:18px;align-items:start}.generator-card,.ideas-output{border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.94);box-shadow:0 14px 46px rgba(20,32,27,.08);padding:22px}.form-stack{display:grid;gap:16px}.field{display:grid;gap:7px;color:var(--muted);font-weight:800}.field select{min-height:44px;border:1px solid var(--line);border-radius:8px;background:white;padding:0 12px;font:inherit}.generate-button,.small-action{min-height:46px;border:0;border-radius:8px;background:var(--mint-dark);color:white;font:inherit;font-weight:900;cursor:pointer}.small-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.small-action{background:#101613;font-size:.9rem}.ideas-grid{display:grid;gap:14px}.idea-card{border:1px solid var(--line);border-radius:8px;background:white;padding:16px}.idea-card h3{margin-bottom:6px}.idea-meta{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.idea-meta span{border-radius:999px;background:#e7f5ef;color:var(--mint-dark);padding:6px 9px;font-size:.78rem;font-weight:900}.card-actions{display:flex;flex-wrap:wrap;gap:8px}.idea-card button{min-height:38px;border:1px solid var(--line);border-radius:8px;background:#101613;color:white;font:inherit;font-weight:850;cursor:pointer}.idea-card button.saved{background:var(--mint-dark)}.vault{margin-top:18px;border-top:1px solid var(--line);padding-top:18px}.vault-list{display:grid;gap:8px;margin-top:10px}.vault-item{border:1px solid var(--line);border-radius:8px;background:#f7faf7;padding:10px 12px}.vault-item strong{font-size:.92rem}.vault-item small,.empty-vault{color:var(--muted);font-weight:800}.toast{position:fixed;right:18px;bottom:18px;z-index:20;display:none;max-width:320px;padding:13px 15px;border-radius:8px;background:#101613;color:white;box-shadow:0 18px 45px rgba(0,0,0,.2);font-weight:850}.toast.visible{display:block}@media(max-width:900px){.app-panel{grid-template-columns:1fr}.toast{left:18px;right:18px;max-width:none}}
    </style>
  </head>
  <body>
    <header class="site-header"><a class="brand" href="./index.html"><span class="brand-mark">N</span><span>NeonLabs</span></a><nav><a href="./index.html#tools">Tools</a><a href="./roomly.html">Roomly</a><a href="./index.html#pricing">Pricing</a></nav><a class="nav-cta" href="./index.html">Home</a></header>
    <main class="tool-page">
      <section class="section-heading"><p class="eyebrow">Startup creation</p><h1>Turn ideas into real startup concepts.</h1><p>Generate fresh Micro SaaS ideas, save the winners, copy plans, and build a simple idea vault.</p></section>
      <section class="app-panel">
        <aside class="generator-card"><div class="form-stack"><label class="field">Category<select id="category"><option>AI</option><option>Fitness</option><option>Finance</option><option>Gaming</option><option>Education</option><option>Real Estate</option><option>Productivity</option></select></label><label class="field">Skill level<select id="skill"><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select></label><label class="field">Monetization<select id="money"><option>Subscription</option><option>Ads</option><option>One-time purchase</option><option>Affiliate</option></select></label><button class="generate-button" id="generate">Generate New Ideas</button><div class="small-actions"><button class="small-action" id="exportVault">Export Vault</button><button class="small-action" id="clearVault">Clear Vault</button></div></div><div class="vault"><p class="eyebrow">Idea Vault</p><p class="empty-vault" id="emptyVault">Stolen ideas will appear here.</p><div class="vault-list" id="vaultList"></div></div></aside>
        <section class="ideas-output"><div class="section-heading"><p class="eyebrow">Generated ideas</p><h2 id="outputTitle">5 AI startup ideas</h2></div><div class="ideas-grid" id="ideasGrid"></div></section>
      </section>
    </main><div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script>
      const ideaParts={AI:{prefix:['Prompt','Copilot','Agent','Workflow','Data','Brief','Support','Creator'],suffix:['Studio','Builder','Radar','Desk','Lab','Pilot','OS','Vault'],audience:['solo founders','support teams','content creators','small agencies','busy operators']},Fitness:{prefix:['Habit','Workout','Form','Meal','Coach','Wellness','Gym','Recovery'],suffix:['Studio','Tracker','Planner','Coach','Hub','Loop','OS','Desk'],audience:['personal trainers','remote teams','new gym members','fitness creators','busy parents']},Finance:{prefix:['Invoice','Cashflow','Budget','Tax','Subscription','Receipt','Profit','Client'],suffix:['Radar','Vault','Planner','Desk','Coach','Snapshot','OS','Track'],audience:['freelancers','small business owners','creators','bookkeepers','side hustlers']},Gaming:{prefix:['Guild','Clip','Indie','Quest','Streamer','Mod','Launch','Playtest'],suffix:['Hub','Planner','Studio','Radar','Vault','Board','Kit','OS'],audience:['streamers','indie devs','gaming communities','mod creators','esports teams']},Education:{prefix:['Study','Tutor','Quiz','Course','Parent','Lesson','Class','Exam'],suffix:['Sprint','Builder','Briefs','Studio','Planner','Vault','Coach','OS'],audience:['students','tutors','teachers','course creators','parents']},RealEstate:{prefix:['Rental','Listing','Open House','Repair','Agent','Basement','Tenant','Lead'],suffix:['Optimizer','Tracker','Planner','Followup','Studio','Briefs','Vault','Desk'],audience:['realtors','landlords','property managers','home flippers','rental hosts']},Productivity:{prefix:['Focus','Inbox','SOP','Client','Weekly','Meeting','Task','Decision'],suffix:['Sprint','Builder','Portal','Briefs','Studio','OS','Vault','Coach'],audience:['consultants','small teams','founders','freelancers','project managers']}};
      const grid=document.querySelector('#ideasGrid'),vaultList=document.querySelector('#vaultList'),emptyVault=document.querySelector('#emptyVault'),toast=document.querySelector('#toast');let vault=JSON.parse(localStorage.getItem('neonlabsIdeaVault')||'[]');let generation=0;let currentIdeas=[];
      function pick(list){return list[Math.floor(Math.random()*list.length)]}function showToast(message){toast.textContent=message;toast.classList.add('visible');setTimeout(()=>toast.classList.remove('visible'),1800)}function saveVault(){localStorage.setItem('neonlabsIdeaVault',JSON.stringify(vault))}function ideaText(idea){return `${idea.name}\nCategory: ${idea.category}\nAudience: ${idea.audience}\nMonetization: ${idea.money}\nDifficulty: ${idea.difficulty}\nBuild time: ${idea.buildTime}\nMVP: onboarding, generated output, saved projects, export/share\nTech stack: Next.js, Supabase, OpenAI API, Stripe later\nRevenue angle: ${idea.revenue}`}
      function renderVault(){vaultList.innerHTML='';emptyVault.style.display=vault.length?'none':'block';vault.forEach((idea,index)=>{const item=document.createElement('div');item.className='vault-item';item.innerHTML='<strong>'+idea.name+'</strong><br><small>'+idea.category+' · '+idea.money+' · '+idea.buildTime+'</small>';vaultList.append(item)})}
      function stealIdea(idea,button){const exists=vault.some(saved=>saved.name===idea.name&&saved.category===idea.category);if(!exists){vault.unshift(idea);saveVault();renderVault()}button.textContent='Saved to Vault';button.classList.add('saved');showToast(exists?'Already in your Idea Vault':'Saved '+idea.name+' to your Idea Vault')}
      function copyIdea(idea){navigator.clipboard.writeText(ideaText(idea));showToast('Idea copied')}
      function makeIdeas(category,skill,money){const kit=ideaParts[category];const used=new Set();const fresh=[];while(fresh.length<5){const name=pick(kit.prefix)+' '+pick(kit.suffix);if(used.has(name))continue;used.add(name);const audience=pick(kit.audience);const difficulty=Math.min(10,Math.max(3,Math.floor(Math.random()*5)+4+(skill==='Advanced'?1:0)));fresh.push({name,category,skill,money,audience,difficulty:difficulty+'/10',buildTime:(Math.floor(Math.random()*3)+2)+'-'+(Math.floor(Math.random()*4)+5)+' weeks',revenue:money==='Subscription'?'$9-$29/month per workspace':money==='Affiliate'?'tool and marketplace partner referrals':money==='Ads'?'free viral tool with sponsor placements':'$19-$99 one-time project packs'})}return fresh}
      function render(){generation+=1;const category=document.querySelector('#category').value,skill=document.querySelector('#skill').value,money=document.querySelector('#money').value;document.querySelector('#outputTitle').textContent='5 new '+category+' startup ideas · batch '+generation;grid.innerHTML='';currentIdeas=makeIdeas(category,skill,money);currentIdeas.forEach((idea)=>{const card=document.createElement('article');card.className='idea-card';card.innerHTML='<h3>'+idea.name+'</h3><p>A '+category.toLowerCase()+' Micro SaaS for '+idea.audience+' that solves one painful workflow with a focused dashboard.</p><div class="idea-meta"><span>Difficulty '+idea.difficulty+'</span><span>'+money+'</span><span>'+idea.buildTime+'</span></div><ul><li>Target users: '+idea.audience+' in '+category.toLowerCase()+'</li><li>MVP: onboarding form, generated output, saved projects, export/share feature</li><li>Revenue angle: '+idea.revenue+'</li><li>Tech stack: Next.js, Supabase, OpenAI API, Stripe later</li></ul>';const actions=document.createElement('div');actions.className='card-actions';const steal=document.createElement('button');steal.textContent='Steal This Idea';steal.addEventListener('click',()=>stealIdea(idea,steal));const copy=document.createElement('button');copy.textContent='Copy Plan';copy.addEventListener('click',()=>copyIdea(idea));actions.append(steal,copy);card.append(actions);grid.append(card)})}
      document.querySelector('#generate').addEventListener('click',render);document.querySelector('#exportVault').addEventListener('click',()=>{navigator.clipboard.writeText(vault.map(ideaText).join('\n\n---\n\n'));showToast('Vault copied')});document.querySelector('#clearVault').addEventListener('click',()=>{vault=[];saveVault();renderVault();showToast('Vault cleared')});renderVault();render();
    </script>
  </body>
</html>
